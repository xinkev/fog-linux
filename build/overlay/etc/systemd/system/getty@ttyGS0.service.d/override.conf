[Unit]
# Do NOT pull usb-gadget.service in: the ADB FunctionFS gadget owns the UDC
# now, and the ACM unit Conflicts with it (it killed adbd on the 2026-11-02
# boot). This getty is only meaningful if ACM is selected explicitly.
After=usb-gadget.service

[Service]
# Root shell on the USB serial console - no password, no keyboard on the phone.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
